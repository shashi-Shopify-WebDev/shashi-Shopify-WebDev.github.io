<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0f2a4a; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div
        id="swing"
        data-composition-id="swing"
        data-composition-src="compositions/swing.html"
        data-start="0"
        data-duration="11.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="11.4"
        data-duration="3.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <!-- Music: "Driving Ambition" from Mixkit (Mixkit Stock Music Free License: ads on social platforms allowed). Starts on a beat so every wipe lands on the beat. -->
      <audio
        id="music-bgm"
        class="clip"
        src="assets/music/driving-ambition-mixkit.mp3"
        data-start="0"
        data-duration="15"
        data-media-start="37.965"
        data-track-index="3"
        data-timeline-role="music"
        data-volume="0.75"
        data-fade-out="1.5"
      ></audio>

      <!-- SFX (Pixabay Content License, bundled with HyperFrames): a whoosh as the string sweeps each line -->
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="0.35" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="1.55" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="2.75" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="3.95" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-5" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="5.15" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-6" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="6.35" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-7" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="7.55" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-8" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="8.75" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-duration="2.1" data-start="11.3" data-track-index="5" data-volume="0.6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
