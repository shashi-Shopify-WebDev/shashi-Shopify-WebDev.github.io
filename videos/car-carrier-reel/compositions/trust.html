<html>
  <template>
    <style>
      #root {
        position: absolute;
        inset: 0;
        font-family: "Montserrat", sans-serif;
        color: #fff;
        background: var(--navy, #0f2a4a);
        overflow: hidden;
      }
      #trust-plate {
        position: absolute;
        inset: 0;
      }
      #trust-img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        object-position: 88% 50%;
      }
      #trust-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(15, 42, 74, 0.95) 0%,
          rgba(15, 42, 74, 0.85) 52%,
          rgba(15, 42, 74, 0.2) 80%
        );
      }
      #trust-copy {
        position: absolute;
        left: 120px;
        top: 310px;
        width: 760px;
      }
      .trust-stat {
        margin-top: 46px;
      }
      .trust-stat:first-child {
        margin-top: 0;
      }
      .trust-num {
        display: block;
        font-weight: 900;
        font-size: 128px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--orange, #f28c1e);
      }
      .trust-label {
        display: block;
        margin-top: 6px;
        font-weight: 700;
        font-size: 42px;
      }
    </style>
    <div id="root" data-composition-id="trust" data-width="1080" data-height="1920">
      <div id="trust-plate" class="clip" data-start="0" data-duration="2.4">
        <img id="trust-img" src="assets/pan-india.webp" alt="Car carrier truck" />
      </div>
      <div id="trust-scrim" class="clip" data-start="0" data-duration="2.4"></div>
      <div id="trust-copy" class="clip" data-start="0" data-duration="2.4">
        <div id="trust-s1" class="trust-stat">
          <span id="trust-n1" class="trust-num">10,000+</span>
          <span class="trust-label">cars delivered safely</span>
        </div>
        <div id="trust-s2" class="trust-stat">
          <span class="trust-num">Since 1997</span>
          <span class="trust-label">29+ years on the road</span>
        </div>
        <div id="trust-s3" class="trust-stat">
          <span class="trust-num">4.8 ★</span>
          <span class="trust-label">Google rating · 240+ reviews</span>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // World fades up under the navy flood carried over from the last scene.
      tl.fromTo("#trust-plate", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);
      // Slow camera push on the plate (the world moves, the titles stay still).
      tl.fromTo("#trust-img", { scale: 1.08 }, { scale: 1.0, duration: 2.4, ease: "power2.inOut" }, 0);
      tl.fromTo(
        ".trust-stat",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: 0.35 },
        0.1,
      );
      // Count up 0 -> 10,000 (deterministic: driven by timeline time).
      const counter = { v: 0 };
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 10000,
          duration: 0.7,
          ease: "expo.out",
          onUpdate: () => {
            document.querySelector("#trust-n1").textContent =
              Math.round(counter.v).toLocaleString("en-IN") + "+";
          },
        },
        0.1,
      );
      // Exit: colour flood to orange for the CTA.
      tl.to("#trust-copy", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 2.1);
      window.__timelines["trust"] = tl;
    </script>
  </template>
</html>
